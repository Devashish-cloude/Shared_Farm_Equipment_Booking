<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sprout.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared Farm — Farm Equipment Sharing & Booking Platform</title>
    <meta name="description" content="Share equipment. Grow together. Peer-to-peer agricultural equipment rental marketplace connecting farmers with modern machinery." />
    
    <!-- Preconnect to image CDN for fast LCP discovery -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    
    <!-- Preload critical LCP Hero image -->
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1592982537447-7440770cbfc9?w=800&auto=format&fit=crop&q=70" fetchpriority="high" />

    <!-- Google Fonts: Plus Jakarta Sans & Inter (asynchronously loaded to avoid render-blocking) -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'" />

      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
    </noscript>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" media="print" onload="this.media='all'" />

      <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <body class="bg-[#F7F8F2] text-[#25312A] font-sans antialiased selection:bg-[#B8D96B] selection:text-[#164B35]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
